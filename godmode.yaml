# godmode environment definition for GeneralsX
# GeneralsX @build Claude 19/08/2026 Give dispatched agents a real C++ toolchain.
#
# Without this file the repository is registered as a "workspace" repo: it declares no
# services, so an agent gets godmode's default base image, which has no gcc, g++, clang,
# clang-tidy, cmake, ninja, pkg-config or nasm, no vcpkg (VCPKG_ROOT unset, /opt/vcpkg
# absent) and, of the game's own libraries, only freetype and fontconfig. An agent could
# read and edit this repository but could not compile a line of it.
#
# Declaring a service changes this from a workspace repo to an ordinary one. The builder
# service must therefore stay up - a service that runs a command and exits takes the
# environment down with it - which is why it runs `sleep infinity`.

compose:
  files:
    - resources/dockerbuild/compose.dev.yml

agent:
  # godmode takes this Compose service's image and layers its own agent tooling (node,
  # claude, codex, opencode, tmux, playwright) on top of it. The contract that base must
  # honour, and how resources/dockerbuild/Dockerfile.dev honours it:
  #
  #   - glibc Debian/Ubuntu: the layering step checks for `apt-get` and for
  #     `getconf GNU_LIBC_VERSION` and fails the whole `up` naming this repository if either
  #     is missing. The image is FROM ubuntu:24.04. Never move it to Alpine or musl.
  #   - no reliance on its own ENTRYPOINT or USER: godmode resets both. The Dockerfile sets
  #     neither; it only sets CMD, and it runs as root.
  #   - tooling reachable without a login shell: an `ENV PATH` in a Dockerfile does not
  #     survive Debian's /etc/profile, so cmake/ctest/cpack/vcpkg are symlinked into
  #     /usr/local/bin as well as living under /opt.
  base_service: builder

  # Must match where compose.dev.yml bind-mounts the checkout (`../..:/work`), so that a
  # file path in agent output is the same path as in build output. /work is also what every
  # scripts/build/linux/docker-*.sh already uses, and those scripts discard build/<preset>
  # when its CMake cache was not generated with CMAKE_HOME_DIRECTORY == /work.
  workdir: /work
