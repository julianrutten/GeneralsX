# GeneralsX development Compose stack
# GeneralsX @build Claude 19/08/2026 Long-lived Linux builder service; also the base image
# godmode layers its agent tooling onto (see godmode.yaml at the repository root).
#
# Usage from the repository root:
#   docker compose -f resources/dockerbuild/compose.dev.yml build builder
#   docker compose -f resources/dockerbuild/compose.dev.yml up -d builder
#   docker compose -f resources/dockerbuild/compose.dev.yml exec builder \
#       bash -lc 'cmake --preset linux64-deploy && cmake --build build/linux64-deploy --target z_generals'
#
# Paths below are relative to THIS file, so ../.. is the repository root.

name: generalsx-dev

services:
  builder:
    # Image name follows the existing scheme in scripts/env/docker/docker-build-images.sh
    # (generalsx/linux-builder, generalsx/mingw-builder).
    image: generalsx/linux-dev:latest
    build:
      context: ../..
      dockerfile: resources/dockerbuild/Dockerfile.dev
      args:
        # Set to "0" for a fast image build with a cold vcpkg binary cache.
        VCPKG_PREWARM: "1"

    # AGENTS.md golden rule 5: "64-bit native - x86_64 only". Every existing docker script
    # passes --platform linux/amd64; matching that keeps an Apple Silicon developer from
    # accidentally producing an arm64 image the presets do not target.
    platform: linux/amd64

    # The service must stay up. Adding services turns this from a godmode "workspace" repo
    # into an ordinary one, and a service that runs a command and exits takes the whole
    # environment down with it. An idle builder is the point: work happens through
    # `exec`, or through the agent that godmode starts from this image.
    command: ["sleep", "infinity"]
    stop_grace_period: 5s

    working_dir: /work

    volumes:
      # The checkout. /work is what every scripts/build/linux/docker-*.sh already uses
      # (-v "$PWD:/work" -w /work), and those scripts wipe build/<preset> if the CMake cache
      # was not generated with CMAKE_HOME_DIRECTORY == /work. godmode.yaml's agent.workdir
      # must match this, so that a path in agent output is the same path as in build output.
      - ../..:/work

      # vcpkg binary cache. The image prewarms /opt/vcpkg-cache; Docker seeds a fresh named
      # volume from the image content on first mount, so the prewarmed archives survive and
      # then keep accumulating across container recreation.
      #
      # Note the difference from resources/dockerbuild/Dockerfile.linux, which instead mounts
      # a whole host vcpkg checkout from ~/.generalsx/vcpkg. That path does not exist on a
      # godmode host and there is no script in this repository that creates it - the one the
      # docs name (scripts/docker-vcpkg-init.sh) is missing. A named volume needs no host-side
      # setup at all, which is why it is used here.
      - vcpkg-cache:/opt/vcpkg-cache

      # ccache, picked up automatically by cmake/ccache.cmake (SAGE_USE_CCACHE defaults ON).
      - ccache:/ccache

    environment:
      VCPKG_ROOT: /opt/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: /opt/vcpkg-cache
      CCACHE_DIR: /ccache

      # Headless runtime, copied from the Linux job in .github/workflows/replay-tests.yml.
      # A container has no display, no audio device and no GPU; lavapipe is the software
      # Vulkan ICD that mesa-vulkan-drivers installs.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      DXVK_WSI_DRIVER: SDL3
      DXVK_LOG_LEVEL: none
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

    # Linking GeneralsXZH is memory-hungry (the stripped binary alone is ~280 MB per the
    # 11/08/2026 worklog entry). Raising the container's file-descriptor limit is cheap and
    # avoids the classic ninja + ld exhaustion on hosts with a low default.
    # ASSUMPTION: not derived from a repository file; it is a container-hygiene default and
    # can be dropped without affecting correctness.
    ulimits:
      nofile:
        soft: 8192
        hard: 8192

volumes:
  vcpkg-cache:
  ccache:
